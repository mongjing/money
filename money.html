<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>money</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#e8e8e8;color:#111;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center}

/* 上方藍色訊息 */
.info{position:fixed;top:24px;left:50%;transform:translateX(-50%);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  padding:16px 22px;display:flex;align-items:center;gap:12px;background:#509AF8;border-radius:8px;box-shadow:0 0 5px -3px #111;white-space:nowrap}
.info__icon{width:24px;height:24px;flex:none;display:flex}
.info__icon svg{width:24px;height:24px}
.info__icon path{fill:#fff}
.info__title{font-weight:500;font-size:clamp(16px,2.2vw,22px);color:#fff;letter-spacing:.04em}

.stage{display:flex;flex-direction:column;align-items:center;gap:56px}
.bill{width:clamp(220px,26vw,320px);image-rendering:pixelated;image-rendering:crisp-edges;display:block;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* 按鈕（同四顆按鈕的樣式，放大） */
.btn-small{position:relative;padding:0;width:clamp(200px,22vw,260px);height:clamp(200px,22vw,260px);
  border:2px solid #888;outline:none;background-color:#f4f5f6;border-radius:30px;
  box-shadow:-3px -10px 15px #fff,-3px -5px 8px #fff,-10px 0 15px #fff,3px 10px 12px rgba(0,0,0,.2);
  transition:.3s ease-in-out;cursor:pointer;font-family:inherit}
.btn-small:active,.btn-small.pressed{transform:scale(.95);box-shadow:none}
@media (hover:hover){.btn-small:hover{transform:scale(1.06)} .btn-small:hover:active{transform:scale(.95);box-shadow:none}}
.btn-small-content{position:relative;display:grid;padding:20px;width:100%;height:100%;
  grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr;
  box-shadow:inset 0 -4px 0 #ddd,0 -4px 0 #f4f5f6;border-radius:30px}
.btn-small-icon{grid-column:4;align-self:start;justify-self:end;font-size:clamp(30px,3.4vw,40px);font-weight:600;color:#555;white-space:nowrap}
.btn-small-text{margin:0;align-self:end;grid-column:1/5;grid-row:2;text-align:center;font-size:clamp(40px,4.6vw,54px);
  background-color:#888;color:transparent;text-shadow:1px 1px 2px rgba(255,255,255,.5);-webkit-background-clip:text;background-clip:text}

.float{position:fixed;font-weight:700;font-size:44px;color:#d65563;pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-80px)}}
</style>
</head>
<body>
  <div class="info">
    <div class="info__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" height="24" fill="none"><path fill="#393a37" d="m12 1.5c-5.79844 0-10.5 4.70156-10.5 10.5 0 5.7984 4.70156 10.5 10.5 10.5 5.7984 0 10.5-4.7016 10.5-10.5 0-5.79844-4.7016-10.5-10.5-10.5zm.75 15.5625c0 .1031-.0844.1875-.1875.1875h-1.125c-.1031 0-.1875-.0844-.1875-.1875v-6.375c0-.1031.0844-.1875.1875-.1875h1.125c.1031 0 .1875.0844.1875.1875zm-.75-8.0625c-.2944-.00601-.5747-.12718-.7808-.3375-.206-.21032-.3215-.49305-.3215-.7875s.1155-.57718.3215-.7875c.2061-.21032.4864-.33149.7808-.3375.2944.00601.5747.12718.7808.3375.206.21032.3215.49305.3215.7875s-.1155.57718-.3215.7875c-.2061.21032-.4864.33149-.7808.3375z"></path></svg></div>
    <div class="info__title">按下按鈕，就可以賺錢。你賺的，是螢幕外那個人的錢。</div>
  </div>
  <div class="stage">
    <img class="bill" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAAA8CAYAAACtrX6oAAAA7klEQVR42u3c4Q2CMBRG0WrYoS7AFkzHbGzBAjCFLoDJF2mqwXN+ExFuSl4i9jbP5VkaGsdH4XPrujX9vLtbem0CC4zACIzACIzACPxPhvTAaUqP3NzVE2rNjlsWKxiBBUZgLjFkUcq+t/0ptNbNCkZgBBaYqw5Z+TtU2UDQehBpLR1selzH0TnS75d2s4I9ohEYgREYgREYgQVGYARGYARGYAQWGIERGIHpakj3ZUr/9dbjZe4ejq7jl158T7tZwR7RCIzAfGnIcgv6DEVWMAIjMAIbsg6l+zLZ8f0cO74jMAILjMAIjMAIjMC88QJFZCVnN/94eAAAAABJRU5ErkJggg==" alt="">
    <button class="btn-small" id="btn">
      <div class="btn-small-content">
        <div class="btn-small-icon">-5</div>
        <p class="btn-small-text">money</p>
      </div>
    </button>
  </div>
<script>
const btn = document.getElementById("btn");
btn.addEventListener("pointerdown", () => {
  btn.classList.add("pressed");
  const r = btn.getBoundingClientRect();
  const f = document.createElement("div");
  f.className = "float"; f.textContent = "-5";
  f.style.left = (r.left + r.width / 2 + (Math.random() * 80 - 40)) + "px";
  f.style.top = (r.top - 20) + "px";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 900);
});
["pointerup","pointerleave","pointercancel"].forEach(e => btn.addEventListener(e, () => btn.classList.remove("pressed")));
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());
</script>
</body>
</html>
